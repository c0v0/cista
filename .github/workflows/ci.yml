name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # 桌面壳（Tauri）在 Linux 上需要 GTK/WebKit 开发包，否则 clippy/test 失败。
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev pkg-config libssl-dev
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: bash scripts/verify.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: bash scripts/verify.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build server image
        run: docker build -t cista:ci .
      - name: Smoke test /healthz
        run: |
          docker run -d --name cista-ci \
            -e CISTA_BOOTSTRAP_TOKEN=ci-bootstrap-token \
            -e CISTA_STATIC_KEY="$(printf 'ab%.0s' $(seq 1 32))" \
            -p 8787:8787 cista:ci
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/healthz; then echo " healthz ok"; ok=1; break; fi
            sleep 1
          done
          docker logs cista-ci | tail -5
          docker rm -f cista-ci
          [ "$ok" = 1 ]
