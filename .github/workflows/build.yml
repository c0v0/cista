name: build

# 推送 main / 打 tag 时自动编译；打 v* tag 时把产物挂到 Release。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build server
        run: cargo build --release -p cista-server
      - uses: actions/upload-artifact@v4
        with:
          name: cista-server-${{ matrix.os }}
          path: |
            target/release/cista-server
            target/release/cista-server.exe
          if-no-files-found: error

  web:
    name: web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web typecheck && pnpm -C web test -- --run
      - run: pnpm -C web build
      - uses: actions/upload-artifact@v4
        with:
          name: cista-web
          path: web/dist
          if-no-files-found: error

  android-core:
    name: android core (arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: android-actions/setup-android@v3
      - name: Install NDK
        run: sdkmanager --install "ndk;26.3.11579264" platform-tools >/dev/null
      - name: Build cista-core for Android
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/26.3.11579264/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK/aarch64-linux-android21-clang"
          export CC_aarch64_linux_android="$NDK/aarch64-linux-android21-clang"
          export AR_aarch64_linux_android="$NDK/llvm-ar"
          cargo build -p cista-core --release --target aarch64-linux-android

  desktop-linux:
    name: desktop (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev pkg-config libssl-dev
      - name: Package desktop
        run: bash scripts/package-desktop.sh deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: cista-desktop-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  desktop-windows:
    name: desktop (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Package desktop (nsis)
        shell: bash
        run: bash scripts/package-desktop.sh nsis
      - uses: actions/upload-artifact@v4
        with:
          name: cista-desktop-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    name: attach release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [server, web, desktop-linux, desktop-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          fail_on_unmatched_files: true
          generate_release_notes: true
