name: build

# 推送 main / 打 tag 时自动编译；打 v* tag 时把产物挂到 Release。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build server
        run: cargo build --release -p cista-server
      - uses: actions/upload-artifact@v4
        with:
          name: cista-server-${{ matrix.os }}
          path: |
            target/release/cista-server
            target/release/cista-server.exe
          if-no-files-found: error

  web:
    name: web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm -C web install --frozen-lockfile
      - run: pnpm -C web typecheck && pnpm -C web test -- --run
      - run: pnpm -C web build
      - uses: actions/upload-artifact@v4
        with:
          name: cista-web
          path: web/dist
          if-no-files-found: error

  android-core:
    name: android core (arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.3.11579264" platform-tools >/dev/null
      - name: Build cista-core for Android
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/26.3.11579264/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK/aarch64-linux-android21-clang"
          export CC_aarch64_linux_android="$NDK/aarch64-linux-android21-clang"
          export AR_aarch64_linux_android="$NDK/llvm-ar"
          cargo build -p cista-core --release --target aarch64-linux-android

  desktop-linux:
    name: desktop (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev pkg-config libssl-dev
      - name: Package desktop
        run: bash scripts/package-desktop.sh deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: cista-desktop-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  desktop-windows:
    name: desktop (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Package desktop (nsis)
        shell: bash
        run: bash scripts/package-desktop.sh nsis
      - uses: actions/upload-artifact@v4
        with:
          name: cista-desktop-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  android-apk:
    name: android apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" "platforms;android-36" "build-tools;34.0.0" "ndk;26.3.11579264" >/dev/null
      - name: Build web assets
        run: |
          pnpm -C web install --frozen-lockfile
          pnpm -C web build
      - name: Init Android project
        working-directory: apps/desktop/src-tauri
        run: pnpm dlx @tauri-apps/cli@2 android init --ci
      - name: Release signing (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "no signing secrets configured; APK will use the debug signature"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cista-release.jks"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/cista-release.jks"
          export ANDROID_KEYSTORE_PASSWORD="$KS_PASSWORD"
          export ANDROID_KEY_ALIAS="$KS_ALIAS"
          export ANDROID_KEY_PASSWORD="$KEY_PASSWORD"
          python3 scripts/android-signing.py
      - name: Build APK
        working-directory: apps/desktop/src-tauri
        run: |
          export NDK_HOME="$ANDROID_SDK_ROOT/ndk/26.3.11579264"
          pnpm dlx @tauri-apps/cli@2 android build --apk --ci --config '{"build":{"beforeBuildCommand":""}}'
      - name: Sign APK with apksigner (optional)
        if: ${{ hashFiles('**/*.apk') != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "no signing secrets configured; leaving APK unsigned (debug-installable only)"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cista-release.jks"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          for apk in $(find apps/desktop/src-tauri/gen/android/app/build/outputs/apk -name "*.apk"); do
            aligned="${apk%-unsigned.apk}-aligned.apk"
            "$BT/zipalign" -p 4 "$apk" "$aligned"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/cista-release.jks" \
              --ks-pass "pass:$KS_PASSWORD" --key-pass "pass:$KEY_PASSWORD" \
              --ks-key-alias "$KS_ALIAS" --out "${apk%-unsigned.apk}-signed.apk" "$aligned"
            echo "signed: ${apk%-unsigned.apk}-signed.apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cista-android-apk
          path: apps/desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  android-emulator:
    name: android install check (emulator)
    needs: [android-apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cista-android-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch on emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb wait-for-device
            APK=$(find apk -name "*-signed.apk" | head -1); if [ -z "$APK" ]; then APK=$(find apk -name "*.apk" | head -1); fi; echo "installing $APK"; adb install -r "$APK"; adb shell am start -W -n com.cista.notes/.MainActivity
            adb shell dumpsys package com.cista.notes | grep -E "versionName|firstInstallTime"

  release:
    name: attach release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [server, web, desktop-linux, desktop-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          fail_on_unmatched_files: true
          generate_release_notes: true
