[package]
name = "cista-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "cista server: axum API, SQLite, content-addressed blobs"

[dependencies]
cista-core = { workspace = true }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "fs", "sync"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sha2 = "0.11"
hex = "0.4"
getrandom = "0.4"
base64 = "0.23"
argon2 = "0.5"
futures-util = "0.3"
yrs = { version = "0.28", features = ["sync"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
