# cista 服务端（单实例）。默认只监听 127.0.0.1，由 Caddy 反代并提供 TLS。
#
#   cp .env.example .env    # 至少填 CISTA_BOOTSTRAP_TOKEN / CISTA_STATIC_KEY
#   docker compose up -d --build
#
# 数据在 ./data（private.db / shared.db / blobs），备份见 scripts/backup.sh。
services:
  cista:
    build: .
    image: cista-server:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 容器内必须绑 0.0.0.0 才能被端口映射访问
      CISTA_BIND: 0.0.0.0:8787
      CISTA_DATA_DIR: /data
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
